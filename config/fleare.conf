# Configuration for My In-Memory Database

# Server settings
server_host = 127.0.0.1
server_port = 4775

# Logging settings
logging_level = info
logging_file = /var/log/mydb/mydb.log

# Memory settings
memory_max_size_mb = 1024
memory_eviction_policy = LRU

# Security settings
security_enable_auth = true
security_auth_method = basic

# Users and roles (Format: user username@password:role)
user admin@admin123:root
user user1@userpass1:read
user user2@userpass2:write

# Data persistence
persistence_enable = true
persistence_path = /var/lib/mydb/data.db
persistence_after_write_count = 100

# Backup settings
backup_enable = true
backup_interval_minutes = 60
backup_dir = /var/backups/mydb

# Other settings
max_connections = 100
misc_timeout_seconds = 30
misc_strict_insert = true
