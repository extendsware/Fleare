syntax = "proto3";

package comm;
option go_package = "internal/comm";

message Object {
  uint32 kind = 1;
  bytes value = 2;
  int64 timestamp = 3;
}

message WALEntry {
  enum Operation {
    UPDATE = 0;
    DELETE = 1;
  }
  Operation op = 1;
  string key = 2;
  Object object = 3;
  uint32 checksum = 4;
}
